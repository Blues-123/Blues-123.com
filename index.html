<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的待办事项</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 50px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .input-group {
            display: flex;
            margin-bottom: 20px;
        }

        #todo-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px 0 0 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        #todo-input:focus {
            border-color: #667eea;
        }

        #add-btn {
            padding: 12px 20px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 0 8px 8px 0;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #add-btn:hover {
            background-color: #5a6fd6;
        }

        ul {
            list-style-type: none;
        }

        li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background-color: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            transition: background-color 0.3s;
            animation: fadeIn 0.3s ease;
        }

        li:hover {
            background-color: #f0f0f0;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 自定义复选框 */
        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #667eea;
            border-radius: 50%;
            margin-right: 15px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .checkbox.checked {
            background-color: #667eea;
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 12px;
            font-weight: bold;
        }

        .todo-text {
            flex: 1;
            font-size: 16px;
            color: #333;
            word-break: break-all;
            transition: color 0.3s, text-decoration 0.3s;
        }

        li.completed .todo-text {
            text-decoration: line-through;
            color: #a0a0a0;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 20px;
            cursor: pointer;
            padding: 0 5px;
            opacity: 0.6;
            transition: opacity 0.3s, transform 0.2s;
        }

        .delete-btn:hover {
            opacity: 1;
            transform: scale(1.2);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 我的待办事项</h1>
    <div class="input-group">
        <input type="text" id="todo-input" placeholder="需要做点什么...">
        <button id="add-btn">添加</button>
    </div>
    <ul id="todo-list">
        <!-- 待办列表会通过 JavaScript 渲染到这里 -->
    </ul>
</div>

<script>
    const todoInput = document.getElementById('todo-input');
    const addBtn = document.getElementById('add-btn');
    const todoList = document.getElementById('todo-list');

    // 从本地浏览器存储获取数据
    let todos = JSON.parse(localStorage.getItem('myTodos')) || [];

    // 渲染列表函数
    function renderTodos() {
        todoList.innerHTML = '';

        todos.forEach((todo, index) => {
            const li = document.createElement('li');
            if (todo.completed) {
                li.classList.add('completed');
            }

            const checkbox = document.createElement('div');
            checkbox.className = 'checkbox' + (todo.completed ? ' checked' : '');
            checkbox.addEventListener('click', () => toggleTodo(index));

            const span = document.createElement('span');
            span.className = 'todo-text';
            span.textContent = todo.text;

            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'delete-btn';
            deleteBtn.innerHTML = '&times;';
            deleteBtn.addEventListener('click', () => deleteTodo(index));

            li.appendChild(checkbox);
            li.appendChild(span);
            li.appendChild(deleteBtn);
            todoList.appendChild(li);
        });

        // 保存到浏览器本地存储
        localStorage.setItem('myTodos', JSON.stringify(todos));
    }

    // 添加任务
    function addTodo() {
        const text = todoInput.value.trim();
        if (text !== '') {
            todos.push({ text: text, completed: false });
            todoInput.value = ''; 
            renderTodos();
        }
    }

    // 切换完成状态
    function toggleTodo(index) {
        todos[index].completed = !todos[index].completed;
        renderTodos();
    }

    // 删除任务
    function deleteTodo(index) {
        const li = todoList.children[index];
        li.style.animation = 'fadeIn 0.3s ease reverse';
        setTimeout(() => {
            todos.splice(index, 1);
            renderTodos();
        }, 250); 
    }

    // 事件绑定
    addBtn.addEventListener('click', addTodo);
    todoInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            addTodo();
        }
    });

    // 初始化
    renderTodos();
</script>

</body>
</html>
